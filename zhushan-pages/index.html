<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>竹山鎮第一選區簡易計票</title>
<style>
:root{--blue:#2459c5;--ink:#17243a;--muted:#65738a;--line:#e3e8ef;--bg:#f5f7fa;--green:#16834a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}header{background:#214da7;color:white;padding:18px 16px}header h1{margin:0;font-size:clamp(20px,4vw,28px)}header p{margin:5px 0 0;opacity:.85}main{max-width:920px;margin:18px auto;padding:0 12px 30px}.top{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.top select,.top button{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}.top select{flex:1;min-width:180px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}.sum{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}.sum small{color:var(--muted)}.sum strong{display:block;font-size:24px;margin-top:4px}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}.panel h2{font-size:17px;margin:0 0 10px}.list{display:grid;gap:8px}.candidate{display:grid;grid-template-columns:44px minmax(120px,1fr) minmax(100px,170px);gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:11px;background:white;transition:.15s}.candidate.leader{border-color:#9bc2ff;background:#f2f7ff}.rank{font-weight:900;color:var(--blue);font-size:18px;text-align:center}.name{font-weight:750}.inputvotes{width:100%;font:inherit;font-size:20px;font-weight:800;text-align:right;padding:8px 10px;border:1px solid #d5dce6;border-radius:9px}.meta{grid-column:2/4;display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:13px}.bar{height:7px;background:#eef2f7;border-radius:20px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--blue);border-radius:20px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 12px;cursor:pointer}.primary{background:var(--blue)!important;color:#fff!important;border-color:var(--blue)!important}.note{font-size:12px;color:var(--muted);margin:12px 2px 0}.modal{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;padding:14px}.dialog{background:white;border-radius:14px;width:min(520px,100%);padding:16px}.dialog h3{margin:0 0 10px}.dialog input{width:100%;padding:10px;margin:5px 0;border:1px solid var(--line);border-radius:8px;font:inherit}.dialog .btns{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}.dialog button{padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:white;font:inherit}.dialog button.save{background:var(--blue);color:white}.totalrow{display:grid;grid-template-columns:42px minmax(100px,1fr) minmax(100px,150px);align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:11px;background:white}.totalrow.toprank{border-color:#9bc2ff;background:#f2f7ff}.totalvotes{text-align:right;font-size:22px;font-weight:850}.empty{text-align:center;padding:25px;color:var(--muted)}@media(max-width:560px){.summary{grid-template-columns:1fr 1fr}.candidate{grid-template-columns:36px minmax(70px,1fr) minmax(90px,130px);gap:6px;padding:8px}.name{font-size:15px}.inputvotes{font-size:18px;padding:7px}.meta{grid-column:1/4}.sum strong{font-size:21px}}

/* Presentation mode: clean, large-font election result board */
body.presentation{background:#0b1530;color:#fff;min-height:100vh}
body.presentation header{background:#0b1530;text-align:center;padding:24px 12px 14px}
body.presentation header h1{font-size:clamp(28px,5vw,54px);letter-spacing:.04em}
header .team-title{font-size:clamp(18px,3vw,24px);font-weight:800;margin:7px 0 0;opacity:1}
header .system-subtitle{margin:5px 0 0;opacity:.85}
body.presentation header .team-title{display:block;font-size:clamp(22px,3.5vw,36px);margin-top:8px}
body.presentation header .system-subtitle{display:none}
body.presentation main{max-width:1500px;margin:0 auto;padding:12px 24px 24px}
body.presentation .top,body.presentation .summary,body.presentation main>section:not(#totalsPanel){display:none!important}
body.presentation #totalsPanel{display:block!important;background:transparent;border:0;padding:0;margin:0!important}
body.presentation #totalsPanel>h2{display:none}
body.presentation #totalsPanel .summary{display:grid!important;grid-template-columns:1fr!important;margin:0 0 20px!important}
body.presentation #totalsPanel .sum{background:#172443;border:1px solid #33466c;border-radius:16px;text-align:center;padding:20px}
body.presentation #totalsPanel .sum small{font-size:clamp(18px,2.4vw,30px);color:#c6d5f3}
body.presentation #totalsPanel .sum strong{font-size:clamp(44px,7vw,92px);color:#fff}
body.presentation #boxCountView{display:none}
body.presentation #totalRanking{gap:14px}
body.presentation .totalrow{grid-template-columns:minmax(60px,100px) minmax(0,1fr) minmax(130px,240px);gap:20px;padding:clamp(14px,2vw,28px);border-radius:16px;background:#172443;border:1px solid #33466c;color:#fff}
body.presentation .totalrow.toprank{background:#20365f;border:2px solid #f5c84c}
body.presentation .rank{font-size:clamp(28px,4vw,52px);color:#f5c84c}
body.presentation .name{font-size:clamp(24px,4vw,50px);font-weight:900}
body.presentation .totalvotes{font-size:clamp(30px,5vw,66px);font-weight:950;white-space:nowrap}
body.presentation .meta{font-size:clamp(15px,2vw,26px);color:#c6d5f3;margin-top:5px}
body.presentation .bar{height:clamp(9px,1.4vw,16px);background:#344765;margin-top:10px}
body.presentation .bar i{background:#56a5ff}
body.presentation #totalsPanel .actions{justify-content:center;margin-top:20px}
body.presentation #totalsPanel .actions button{font-size:18px;padding:12px 18px;background:#263a60;color:#fff;border-color:#415780}
@media(max-width:650px){body.presentation main{padding:8px}body.presentation .totalrow{grid-template-columns:42px minmax(0,1fr) minmax(85px,120px);gap:8px;padding:10px}body.presentation .name{font-size:clamp(18px,5vw,26px)}body.presentation .totalvotes{font-size:clamp(20px,6vw,34px)}}
</style></head><body>
<header><h1>竹山鎮鎮民代表第一選區</h1><p class="team-title">2號洪明汝競選團隊</p><p class="system-subtitle">簡易計票｜直接輸入各票箱候選人總票數，排名自動更新</p></header>
<main><div class="top"><select id="box"></select><button id="addBox">＋新增票箱</button><button id="editCandidates">候選人設定</button><button id="showTotals">總票數畫面</button><button id="displayMode">純展示模式</button><button id="export">匯出 CSV</button></div>
<div class="summary"><div class="sum"><small>目前票箱總票數</small><strong id="boxTotal">0</strong></div><div class="sum"><small>全區累計票數</small><strong id="grandTotal">0</strong></div><div class="sum"><small>目前領先</small><strong id="leader">—</strong></div></div>
<section class="panel"><h2>候選人票數（固定依號次排列）</h2><div id="candidates" class="list"></div><div class="actions"><button id="clearBox">清除此票箱數據</button><button id="backup">下載資料備份</button><button id="restore">匯入備份</button><button id="resetAll">重設全部</button></div><p class="note">票數依數字自動排序；票數相同時依候選人號次排序。資料存在此裝置的瀏覽器，請定期下載備份。此工具供輔助統計及核對使用。</p></section><section class="panel" id="totalsPanel" style="display:none;margin-top:12px"><h2>全區總票數排名</h2><div class="summary" style="grid-template-columns:1fr 1fr"><div class="sum"><small>全區候選人累計總票數</small><strong id="totalVotesView">0</strong></div><div class="sum"><small>目前登錄票箱數</small><strong id="boxCountView">0</strong></div></div><div id="totalRanking" class="list"></div><div class="actions"><button id="backEntry">返回票箱輸入</button><button id="exitDisplay" style="display:none">退出展示模式</button><button id="fullScreen">全螢幕</button></div></section></main>
<div class="modal" id="modal"><div class="dialog"><h3 id="mtitle"></h3><div id="mbody"></div><div class="btns"><button id="cancel">取消</button><button class="save" id="save">儲存</button></div></div></div><input id="file" type="file" accept="application/json" hidden>
<script>
const KEY='zhushan_simple_tally_v2';let data=load();let active=data.boxes[0]?.id||'';let modalMode='';
function load(){try{let d=JSON.parse(localStorage.getItem(KEY));if(d?.candidates&&d?.boxes)return d}catch{}return{candidates:[{id:'c1',number:1,name:'候選人 A'},{id:'c2',number:2,name:'候選人 B'},{id:'c3',number:3,name:'候選人 C'}],boxes:[{id:'b1',name:'票箱 1',votes:{}}]}}
function persist(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function totals(){let t={};data.candidates.forEach(c=>t[c.id]=0);data.boxes.forEach(b=>data.candidates.forEach(c=>t[c.id]+=Number(b.votes[c.id]||0)));return t}
function sorted(arr){return [...arr].sort((a,b)=>b.votes-a.votes||Number(a.number)-Number(b.number))}
function render(){let boxSel=document.getElementById('box');boxSel.innerHTML=data.boxes.map(b=>`<option value="${b.id}" ${b.id===active?'selected':''}>${esc(b.name)}</option>`).join('');let b=data.boxes.find(x=>x.id===active)||data.boxes[0];if(!b)return;active=b.id;let all=totals(),local=[...data.candidates].sort((a,b)=>Number(a.number)-Number(b.number)).map(c=>({...c,votes:Number(b.votes[c.id]||0),total:Number(all[c.id]||0)}));let boxTotal=local.reduce((s,c)=>s+c.votes,0),grand=Object.values(all).reduce((s,n)=>s+n,0);document.getElementById('boxTotal').textContent=boxTotal.toLocaleString();document.getElementById('grandTotal').textContent=grand.toLocaleString();let lead=sorted(local)[0];document.getElementById('leader').textContent=lead&&lead.total>0?lead.name:'—';document.getElementById('candidates').innerHTML=local.map((c,i)=>{let pct=grand?c.total/grand*100:0;return `<div class="candidate"><div class="rank">${esc(c.number)}</div><div class="name">${esc(c.number)}號 ${esc(c.name)}</div><input class="inputvotes" type="number" min="0" step="1" value="${c.votes}" data-vote="${c.id}" aria-label="${esc(c.name)}票數"><div class="meta"><span>全區 ${c.total.toLocaleString()}票</span><span>${pct.toFixed(1)}%</span></div><div class="meta" style="display:block"><div class="bar"><i style="width:${pct}%"></i></div></div></div>`}).join('')||'<div class="empty">請先設定候選人</div>';let overall=sorted(data.candidates.map(c=>({...c,votes:Number(all[c.id]||0)})));document.getElementById('totalVotesView').textContent=grand.toLocaleString();document.getElementById('boxCountView').textContent=data.boxes.length.toLocaleString();document.getElementById('totalRanking').innerHTML=overall.map((c,i)=>{let pct=grand?c.votes/grand*100:0;return `<div class=\"totalrow ${i===0&&c.votes>0?'toprank':''}\"><div class=\"rank\">${i+1}</div><div><div class=\"name\">${esc(c.number)}號 ${esc(c.name)}</div><div class=\"bar\"><i style=\"width:${pct}%\"></i></div><div class=\"meta\" style=\"grid-column:auto">${pct.toFixed(1)}% 得票率</div></div><div class=\"totalvotes\">${c.votes.toLocaleString()} 票</div></div>`}).join('')||'<div class=\"empty\">請先設定候選人</div>'}
function esc(s){return String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
document.getElementById('box').onchange=e=>{active=e.target.value;render()};document.getElementById('candidates').addEventListener('input',e=>{let id=e.target.dataset.vote;if(!id)return;let b=data.boxes.find(x=>x.id===active);b.votes[id]=Math.max(0,Math.floor(Number(e.target.value)||0));persist()});
function open(title,html,mode){modalMode=mode;document.getElementById('mtitle').textContent=title;document.getElementById('mbody').innerHTML=html;document.getElementById('modal').style.display='flex'}function close(){document.getElementById('modal').style.display='none'}document.getElementById('cancel').onclick=close;
document.getElementById('save').onclick=()=>{if(modalMode==='box'){let name=document.getElementById('boxname').value.trim();if(name){let id='b'+Date.now();data.boxes.push({id,name,votes:{}});active=id}}else if(modalMode==='candidates'){let rows=[...document.querySelectorAll('.candrow')].map(r=>({id:r.dataset.id,number:r.querySelector('.num').value.trim(),name:r.querySelector('.cname').value.trim()})).filter(c=>c.name);data.candidates=rows}persist();close()};
document.getElementById('addBox').onclick=()=>open('新增票箱','<input id="boxname" placeholder="票箱名稱，例如：第1票箱">','box');
document.getElementById('editCandidates').onclick=()=>{let html=data.candidates.map(c=>`<div class="candrow" data-id="${c.id}" style="display:flex;gap:6px"><input class="num" style="width:75px" value="${esc(c.number)}" placeholder="號次"><input class="cname" value="${esc(c.name)}" placeholder="候選人姓名"></div>`).join('')+'<button id="newCandidate" type="button" style="margin-top:8px">＋新增候選人</button>';open('候選人設定',html,'candidates');setTimeout(()=>{let btn=document.getElementById('newCandidate');btn.onclick=()=>{let div=document.createElement('div');div.className='candrow';div.dataset.id='c'+Date.now();div.style='display:flex;gap:6px';div.innerHTML='<input class="num" style="width:75px" placeholder="號次"><input class="cname" placeholder="候選人姓名">';btn.before(div)}},0)};
document.getElementById('clearBox').onclick=()=>{if(confirm('清除目前票箱的所有票數？')){data.boxes.find(x=>x.id===active).votes={};persist()}};document.getElementById('resetAll').onclick=()=>{if(confirm('重設所有票箱、候選人與票數？')){localStorage.removeItem(KEY);data=load();active=data.boxes[0].id;render()}};
document.getElementById('export').onclick=()=>{let rows=[['票箱',...data.candidates.map(c=>`${c.number}號 ${c.name}`)],...data.boxes.map(b=>[b.name,...data.candidates.map(c=>b.votes[c.id]||0)]),['全區合計',...data.candidates.map(c=>totals()[c.id])]];let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');download('竹山鎮第一選區計票.csv',csv,'text/csv;charset=utf-8')};
document.getElementById('backup').onclick=()=>download('計票備份.json',JSON.stringify(data,null,2),'application/json');document.getElementById('restore').onclick=()=>document.getElementById('file').click();document.getElementById('file').onchange=e=>{let f=e.target.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{try{let d=JSON.parse(reader.result);if(d.candidates&&d.boxes){data=d;active=data.boxes[0]?.id||'';persist();alert('匯入成功')}else alert('備份格式不正確')}catch{alert('檔案讀取失敗')}};reader.readAsText(f);e.target.value=''};
document.getElementById('showTotals').onclick=()=>{document.getElementById('totalsPanel').style.display='block';document.getElementById('showTotals').textContent='總票數畫面已開啟';document.getElementById('totalsPanel').scrollIntoView({behavior:'smooth'});};document.getElementById('backEntry').onclick=()=>{document.getElementById('totalsPanel').style.display='none';document.getElementById('showTotals').textContent='總票數畫面';window.scrollTo({top:0,behavior:'smooth'});};
function download(name,content,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
document.getElementById('displayMode').onclick=()=>{document.body.classList.add('presentation');document.getElementById('totalsPanel').style.display='block';document.getElementById('exitDisplay').style.display='inline-block';document.getElementById('backEntry').style.display='none';document.getElementById('fullScreen').style.display='inline-block';document.getElementById('showTotals').textContent='總票數畫面';};
document.getElementById('exitDisplay').onclick=()=>{document.body.classList.remove('presentation');document.getElementById('exitDisplay').style.display='none';document.getElementById('backEntry').style.display='inline-block';document.getElementById('totalsPanel').style.display='none';window.scrollTo({top:0,behavior:'smooth'});};
document.getElementById('fullScreen').onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){alert('此瀏覽器無法啟用全螢幕，請按 F11。')}};
render();
</script></body></html>
