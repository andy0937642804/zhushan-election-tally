<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>竹山鎮鎮民代表第一選區｜2號洪明汝競選團隊</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#18212b;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}header{background:#123f69;color:#fff;padding:18px 16px;text-align:center}header h1{margin:0;font-size:clamp(20px,4vw,30px)}header p{margin:7px 0 0;color:#e2edf8;font-weight:700}.wrap{max-width:1100px;margin:auto;padding:14px}.panel{background:white;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 12px #0000000c}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn{border:0;border-radius:9px;padding:10px 13px;background:#174d79;color:white;font-weight:700;cursor:pointer}.btn.secondary{background:#e9eef3;color:#233647}.btn.danger{background:#a93434}.btn:disabled{opacity:.5}.input{padding:10px;border:1px solid #ccd5dd;border-radius:8px;min-width:0}.login{max-width:420px;margin:30px auto}.muted{color:#647481;font-size:13px}.candidate-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.candidate{border:1px solid #dce4eb;border-radius:12px;padding:12px}.candidate .num{font-weight:900;color:#174d79}.candidate input{width:100%;margin:5px 0}.boxcard{border:1px solid #dce4eb;border-radius:12px;margin:12px 0;overflow:hidden}.boxhead{background:#eef3f7;padding:10px 12px;font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:8px}.votes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;padding:12px}.voteitem label{display:block;font-size:13px;font-weight:700;margin-bottom:4px}.voteitem input{width:100%;font-size:18px}.total{font-size:32px;font-weight:900}.rankrow{display:flex;align-items:center;gap:12px;padding:12px;border-bottom:1px solid #e5ebf0}.rank{font-size:25px;font-weight:900;width:44px;color:#174d79}.rankname{flex:1;font-weight:800}.rankvotes{font-size:25px;font-weight:900}.display{background:#061b2c;color:#fff;min-height:100vh;padding:4vw}.display h1{text-align:center;font-size:clamp(28px,5vw,60px);margin:0}.display .subtitle{text-align:center;font-size:clamp(16px,2vw,25px);margin:12px 0 30px}.display .grandtotal{text-align:center;font-size:clamp(28px,5vw,64px);font-weight:900;margin:20px}.display .rankrow{border-color:#23435d;padding:1.2vw}.display .rank{font-size:clamp(24px,4vw,52px);color:#8ed1ff}.display .rankname{font-size:clamp(22px,3.6vw,48px)}.display .rankvotes{font-size:clamp(24px,4vw,52px)}.display .list{max-width:1200px;margin:auto}.displaybtn{position:fixed;right:15px;bottom:15px}.hide{display:none!important}
</style></head><body><header><h1>竹山鎮鎮民代表第一選區</h1><p>2號洪明汝競選團隊｜雲端同步計票系統</p></header><main id="app" class="wrap"><section class="panel login"><h2>管理者登入</h2><p class="muted">登入後才能輸入或修改票數。公開展示畫面可直接查看。</p><input id="email" class="input" type="email" placeholder="管理者 Email" style="width:100%;margin-bottom:8px"><input id="password" class="input" type="password" placeholder="密碼" style="width:100%;margin-bottom:8px"><div class="row"><button class="btn" id="login">登入</button><button class="btn secondary" id="displayOpen">開啟展示模式</button></div><p id="loginmsg" class="muted"></p></section><section id="admin" class="hide"><div class="panel"><div class="row"><strong id="authstatus">已登入</strong><span id="syncstatus" class="muted">正在連線雲端…</span><div style="flex:1"></div><button class="btn secondary" id="displayBtn">展示模式</button><button class="btn secondary" id="exportBtn">匯出備份</button><label class="btn secondary">匯入備份<input type="file" id="importFile" accept=".json" hidden></label><button class="btn secondary" id="logout">登出</button></div></div>
<div class="panel"><h2>候選人設定</h2><p class="muted">輸入候選人名稱；計票輸入欄固定依候選人編號順序，不會跳動。</p><div id="candidateEdit" class="candidate-grid"></div><div class="row" style="margin-top:10px"><button class="btn secondary" id="addCandidate">新增候選人</button><button class="btn" id="saveCandidates">儲存候選人設定</button></div></div>
<div class="panel"><h2>票箱計票</h2><div class="row"><input class="input" id="newBoxName" placeholder="新增票箱名稱（如：第1投開票所）"><button class="btn" id="addBox">新增票箱</button></div><div id="boxes"></div></div>
<div class="panel"><h2>全區即時排名</h2><div class="total">總票數：<span id="grand">0</span></div><div id="ranking"></div></div></section></main>
<div id="displayView" class="display hide"><h1>竹山鎮鎮民代表第一選區</h1><div class="subtitle">2號洪明汝競選團隊｜即時計票結果</div><div class="grandtotal">全區總票數：<span id="displayGrand">0</span></div><div id="displayRanking" class="list"></div><button class="btn displaybtn" id="displayExit">返回</button></div>
<script>
const SUPABASE_URL="https://qmfpvfcgpsxjzbbthfld.supabase.co";
const SUPABASE_KEY="sb_publishable_oYlMthn8r8d5eG_wTs-SMQ_2iHxF06h";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let session=null, state={candidates:[{id:"1",name:"候選人1"},{id:"2",name:"洪明汝"},{id:"3",name:"候選人3"}],boxes:[]},channel=null,editing=false;
const $=id=>document.getElementById(id);
function totalVotes(){return state.candidates.reduce((s,c)=>s+state.boxes.reduce((b,x)=>b+(Number(x.votes?.[c.id])||0),0),0)}
function totals(){return state.candidates.map(c=>({id:c.id,name:c.name,votes:state.boxes.reduce((s,b)=>s+(Number(b.votes?.[c.id])||0),0)})).sort((a,b)=>b.votes-a.votes||Number(a.id)-Number(b.id))}
function rankHTML(){return totals().map((c,i)=>'<div class="rankrow"><div class="rank">'+(i+1)+'</div><div class="rankname">'+esc(c.name||("候選人"+c.id))+'</div><div class="rankvotes">'+c.votes.toLocaleString()+' 票</div></div>').join("")}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function render(){if(!$("admin").classList.contains("hide")){renderCandidates();renderBoxes();$("grand").textContent=totalVotes().toLocaleString();$("ranking").innerHTML=rankHTML()}renderDisplay()}
function renderCandidates(){$("candidateEdit").innerHTML=state.candidates.slice().sort((a,b)=>Number(a.id)-Number(b.id)).map(c=>'<div class="candidate"><div class="num">候選人編號 '+esc(c.id)+'</div><input class="input" value="'+esc(c.name)+'" data-cid="'+esc(c.id)+'" placeholder="候選人姓名"></div>').join("")}
function renderBoxes(){$("boxes").innerHTML=state.boxes.map((b,i)=>'<div class="boxcard"><div class="boxhead"><span>'+esc(b.name)+'</span><div class="row"><button class="btn secondary" data-rename="'+i+'">改名</button><button class="btn danger" data-del="'+i+'">刪除</button></div></div><div class="votes">'+state.candidates.slice().sort((a,b)=>Number(a.id)-Number(b.id)).map(c=>'<div class="voteitem"><label>'+esc(c.id)+'號｜'+esc(c.name)+'</label><input class="input vote" type="number" min="0" step="1" value="'+Number(b.votes?.[c.id]||0)+'" data-box="'+i+'" data-cid="'+esc(c.id)+'"></div>').join("")+'</div></div>').join("")}
function renderDisplay(){$("displayGrand").textContent=totalVotes().toLocaleString();$("displayRanking").innerHTML=rankHTML()}
async function save(){if(!session){alert("請先登入管理者帳號");return} $("syncstatus").textContent="儲存中…";const {error}=await sb.from("election_tally").update({data:state,updated_at:new Date().toISOString(),updated_by:session.user.id}).eq("id","main");if(error){$("syncstatus").textContent="同步失敗："+error.message;alert("雲端儲存失敗："+error.message)}else $("syncstatus").textContent="已同步雲端 · "+new Date().toLocaleTimeString()}
async function load(){const {data,error}=await sb.from("election_tally").select("data").eq("id","main").single();if(error){$("syncstatus").textContent="讀取失敗："+error.message;return}if(data?.data&&Array.isArray(data.data.candidates)&&Array.isArray(data.data.boxes))state=data.data;render();$("syncstatus").textContent="雲端資料已載入"}
async function startRealtime(){if(channel)await sb.removeChannel(channel);channel=sb.channel("tally-live").on("postgres_changes",{event:"UPDATE",schema:"public",table:"election_tally",filter:"id=eq.main"},payload=>{if(payload.new?.data){state=payload.new.data;render();$("syncstatus").textContent="其他裝置已更新 · "+new Date().toLocaleTimeString()}}).subscribe()}
$("login").onclick=async()=>{const email=$("email").value.trim(),password=$("password").value;const {data,error}=await sb.auth.signInWithPassword({email,password});if(error){$("loginmsg").textContent=error.message;return}session=data.session; $("loginmsg").textContent="登入成功";$("app").querySelector(".login").classList.add("hide");$("admin").classList.remove("hide");await load();await startRealtime()}
$("logout").onclick=async()=>{await sb.auth.signOut();session=null;$("admin").classList.add("hide");$("app").querySelector(".login").classList.remove("hide")}
$("saveCandidates").onclick=async()=>{document.querySelectorAll("[data-cid]").forEach(input=>{const c=state.candidates.find(c=>c.id===input.dataset.cid);if(c)c.name=input.value.trim()});render();await save()}
$("addCandidate").onclick=()=>{const max=Math.max(0,...state.candidates.map(c=>Number(c.id)||0));state.candidates.push({id:String(max+1),name:"新候選人"});render()}
$("addBox").onclick=async()=>{const n=$("newBoxName").value.trim();if(!n)return;state.boxes.push({name:n,votes:Object.fromEntries(state.candidates.map(c=>[c.id,0]))});$("newBoxName").value="";render();await save()}
$("boxes").addEventListener("change",async e=>{if(e.target.classList.contains("vote")){const b=state.boxes[Number(e.target.dataset.box)],id=e.target.dataset.cid;const v=Math.max(0,Math.floor(Number(e.target.value)||0));b.votes[id]=v;render();await save()}})
$("boxes").addEventListener("click",async e=>{const d=e.target.dataset.del,r=e.target.dataset.rename;if(d!==undefined){if(confirm("確定刪除這個票箱及其票數？")){state.boxes.splice(Number(d),1);render();await save()}}if(r!==undefined){const b=state.boxes[Number(r)],n=prompt("請輸入票箱名稱",b.name);if(n?.trim()){b.name=n.trim();render();await save()}}})
$("exportBtn").onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="竹山計票雲端備份.json";a.click();URL.revokeObjectURL(a.href)}
$("importFile").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const parsed=JSON.parse(await f.text());if(!Array.isArray(parsed.candidates)||!Array.isArray(parsed.boxes))throw Error("格式不正確");state=parsed;render();await save();alert("備份匯入並同步完成")}catch(err){alert("匯入失敗："+err.message)}e.target.value=""}
function openDisplay(){$("app").classList.add("hide");$("displayView").classList.remove("hide");renderDisplay();if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{})}
function closeDisplay(){$("displayView").classList.add("hide");$("app").classList.remove("hide");if(document.fullscreenElement)document.exitFullscreen().catch(()=>{})}
$("displayBtn").onclick=openDisplay;$("displayOpen").onclick=openDisplay;$("displayExit").onclick=closeDisplay;
</script></body></html>
