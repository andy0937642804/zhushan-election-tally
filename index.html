e:clamp(13px,1.4vw,20px);font-weight:700;overflow-wrap:anywhere}.display .boxvotes{font-size:clamp(16px,1.8vw,27px);font-weight:900;white-space:nowrap}.display .box-selector{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.display .box-selector button{background:#143e5a;border:1px solid #47728e;color:#fff;border-radius:7px;padding:6px 10px;font-size:clamp(12px,1.2vw,17px);font-weight:700;cursor:pointer}.display .box-selector button.active{background:#2b83bd;border-color:#8ed1ff;box-shadow:0 0 0 2px #8ed1ff55}.display .box-detail-total{text-align:center;font-weight:900;font-size:clamp(18px,2vw,28px);margin:6px 0 10px}.display .box-candidate-row{display:flex;align-items:center;gap:8px;border-bottom:1px solid #23435d;padding:clamp(5px,0.8vw,10px)}.display .box-candidate-rank{font-size:clamp(16px,1.7vw,24px);font-weight:900;color:#8ed1ff;min-width:26px}.display .box-candidate-name{flex:1;min-width:0;font-size:clamp(14px,1.4vw,21px);font-weight:700}.display .box-candidate-votes{font-size:clamp(17px,1.8vw,26px);font-weight:900;white-space:nowrap}.displaybtn{position:fixed;right:12px;bottom:12px;z-index:5}.hide{display:none!important}@media(max-width:700px){.display{padding:9px}.display .display-columns{grid-template-columns:1fr;gap:8px}.display .candidate-list{grid-template-columns:repeat(2,minmax(0,1fr));gap:3px}.display .rankrow{padding:4px}.display .rank{width:20px}.display .rankname{font-size:14px}.display .rankvotes{font-size:15px}.display .boxrankrow{padding:4px}.display .boxname{font-size:13px}.display .boxvotes{font-size:15px}.display .section-title{font-size:15px}.display .grandtotal{margin:3px 0 6px}.display .subtitle{margin:2px 0 4px}}
.quickbox-wrap{margin:12px 0;padding:10px;background:#f1f6fb;border:1px solid #c8d9e7;border-radius:10px;display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap}.quickbox-selector{display:flex;flex-wrap:wrap;gap:6px;flex:1}.quickbox-selector button{border:1px solid #7d9db6;background:#fff;color:#23445b;border-radius:8px;padding:7px 12px;font-weight:700;cursor:pointer}.quickbox-selector button.active{background:#176da1;color:#fff;border-color:#176da1}.quickbox-selector button:hover{filter:brightness(.96)}</style></head><body><header><h1>竹山鎮鎮民代表第一選區</h1><p>2號洪明汝競選團隊｜雲端同步計票系統</p></header><main id="app" class="wrap"><section class="panel login"><h2>管理者登入</h2><p class="muted">登入後才能輸入或修改票數。公開展示畫面可直接查看。</p><input id="email" class="input" type="email" placeholder="管理者 Email" style="width:100%;margin-bottom:8px"><input id="password" class="input" type="password" placeholder="密碼" style="width:100%;margin-bottom:8px"><div class="row"><button class="btn" id="login">登入</button><button class="btn secondary" id="displayOpen">開啟展示模式</button></div><p id="loginmsg" class="muted"></p></section><section id="admin" class="hide"><div class="panel"><div class="row"><strong id="authstatus">已登入</strong><span id="syncstatus" class="muted">正在連線雲端…</span><div style="flex:1"></div><button class="btn secondary" id="displayBtn">展示模式</button><button class="btn secondary" id="exportBtn">匯出備份</button><label class="btn secondary">匯入備份<input type="file" id="importFile" accept=".json" hidden></label><button class="btn secondary" id="logout">登出</button></div></div>

<script>
const SUPABASE_URL="https://qmfpvfcgpsxjzbbthfld.supabase.co";
const SUPABASE_KEY="sb_publishable_oYlMthn8r8d5eG_wTs-SMQ_2iHxF06h";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let session=null, pollTimer=null, state={candidates:Array.from({length:14},(_,i)=>({id:String(i+1),name:"候選人"+(i+1)})),boxes:[]},channel=null,editing=false;
const $=id=>document.getElementById(id);
function normalizeCandidates(data){const existing=Array.isArray(data.candidates)?data.candidates:[];const byId=new Map(existing.map(x=>[String(x.id),x]));data.candidates=Array.from({length:14},(_,i)=>{const id=String(i+1),old=byId.get(id);return old?{...old,id}:{id,name:"候選人"+id}});return data}function totalVotes(){return state.candidates.reduce((s,c)=>s+state.boxes.reduce((b,x)=>b+(Number(x.votes?.[c.id])||0),0),0)}
function totals(){return state.candidates.map(c=>({id:c.id,name:c.name,votes:state.boxes.reduce((s,b)=>s+(Number(b.votes?.[c.id])||0),0)})).sort((a,b)=>b.votes-a.votes||Number(a.id)-Number(b.id))}
function rankHTML(){return totals().map((c,i)=>'<div class="rankrow"><div class="rank">'+(i+1)+'</div><div class="rankname">'+esc(c.name||("候選人"+c.id))+'</div><div class="rankvotes">'+c.votes.toLocaleString()+' 票</div></div>').join("")}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function render(){if(!$("admin").classList.contains("hide")){renderCandidates();renderBoxes();$("grand").textContent=totalVotes().toLocaleString();$("ranking").innerHTML=rankHTML()}renderDisplay()}
function renderCandidates(){$("candidateEdit").innerHTML=state.candidates.slice().sort((a,b)=>Number(a.id)-Number(b.id)).map(c=>'<div class="candidate"><div class="num">候選人編號 '+esc(c.id)+'</div><input class="input" value="'+esc(c.name)+'" data-cid="'+esc(c.id)+'" placeholder="候選人姓名"></div>').join("")}
function boxTotal(b){return state.candidates.reduce((sum,c)=>sum+(Number(b.votes?.[c.id])||0),0)}
let selectedQuickBox=null;
function renderBoxes(){if(selectedQuickBox!==null&&!state.boxes[selectedQuickBox])selectedQuickBox=null;$("quickBoxSelector").innerHTML='<button type="button" class="'+(selectedQuickBox===null?'active':'')+'" data-quickbox="all">全部票箱</button>'+state.boxes.map((b,i)=>'<button type="button" class="'+(selectedQuickBox===i?'active':'')+'" data-quickbox="'+i+'">'+esc(b.name)+'</button>').join("");const visibleBoxes=state.boxes.map((b,i)=>({b,i})).filter(x=>selectedQuickBox===null||x.i===selectedQuickBox);$("boxes").innerHTML=visibleBoxes.map(({b,i})=>'<div class="boxcard"><div class="boxhead"><span>'+esc(b.name)+'｜票倉總票數：<strong>'+boxTotal(b).toLocaleString()+'</strong></span><div class="row"><button class="btn secondary" data-rename="'+i+'">改名</button><button class="btn secondary" data-clear="'+i+'">清除此票倉</button><button class="btn danger" data-del="'+i+'">刪除</button></div></div><div class="votes">'+state.candidates.slice().sort((a,b)=>Number(a.id)-Number(b.id)).map(c=>'<div class="voteitem"><label>'+esc(c.id)+'號｜'+esc(c.name)+'</label><input class="input vote" type="number" min="0" step="1" value="'+Number(b.votes?.[c.id]||0)+'" data-box="'+i+'" data-cid="'+esc(c.id)+'"></div>').join("")+'</div></div>').join("")}
let selectedDisplayBox=null;
function renderDisplay(){$("displayGrand").textContent=totalVotes().toLocaleString();const displayTotals=totals();const topFive=displayTotals.slice(0,5);$("displayTop5").innerHTML=topFive.map((candidate,i)=>'<div class="top5-card"><div class="top5-rank">第'+(i+1)+'名</div><div class="top5-name">'+esc(candidate.name||("候選人"+candidate.id))+'</div><div class="top5-votes">'+candidate.votes.toLocaleString()+' 票</div></div>').join("")||'<div class="syncmsg">尚無候選人</div>';$("displayRanking").innerHTML=displayTotals.slice(5).map((candidate,i)=>'<div class="rankrow"><div class="rank">'+(i+6)+'</div><div class="rankname">'+esc(candidate.name||("候選人"+candidate.id))+'</div><div class="rankvotes">'+candidate.votes.toLocaleString()+' 票</div></div>').join("")||'<div class="syncmsg">目前沒有第6名之後候選人</div>';const sortedBoxes=state.boxes.map((b,i)=>({box:b,index:i,name:b.name,votes:boxTotal(b)})).sort((a,b)=>b.votes-a.votes||a.index-b.index);if(selectedDisplayBox===null||!state.boxes[selectedDisplayBox])selectedDisplayBox=sortedBoxes.length?sortedBoxes[0].index:null;$("displayBoxSelector").innerHTML=sortedBoxes.map(b=>'<button type="button" class="'+(selectedDisplayBox===b.index?'active':'')+'" data-displaybox="'+b.index+'">'+esc(b.name)+'</button>').join("")||'<div class="syncmsg">尚未新增票倉</div>';if(selectedDisplayBox===null){$("displayBoxDetail").innerHTML='';return}const box=state.boxes[selectedDisplayBox],boxCandidates=state.candidates.map(c=>({id:c.id,name:c.name,votes:Number(box.votes?.[c.id]||0)})).sort((a,b)=>b.votes-a.votes||Number(a.id)-Number(b.id));$("displayBoxDetail").innerHTML='<div class="box-detail-total">'+esc(box.name)+'｜總票數：'+boxTotal(box).toLocaleString()+' 票</div>'+boxCandidates.map((candidate,i)=>'<div class="box-candidate-row"><div class="box-candidate-rank">'+(i+1)+'</div><div class="box-candidate-name">'+esc(candidate.id)+'號｜'+esc(candidate.name)+'</div><div class="box-candidate-votes">'+candidate.votes.toLocaleString()+' 票</div></div>').join("")}
async function save(){if(!session){alert("請先登入管理者帳號");return} $("syncstatus").textContent="儲存中…";const {error}=await sb.from("election_tally").update({data:state,updated_at:new Date().toISOString(),updated_by:session.user.id}).eq("id","main");if(error){$("syncstatus").textContent="同步失敗："+error.message;alert("雲端儲存失敗："+error.message)}else $("syncstatus").textContent="已同步雲端 · "+new Date().toLocaleTimeString()}
async function load(){const {data,error}=await sb.from("election_tally").select("data").eq("id","main").single();if(error){$("syncstatus").textContent="讀取失敗："+error.message;if($("displaySync"))$("displaySync").textContent="雲端讀取失敗："+error.message;return false}if(data?.data&&Array.isArray(data.data.candidates)&&Array.isArray(data.data.boxes)){state=normalizeCandidates(data.data);render();if(data.data.candidates.length!==14){await save()}$("syncstatus").textContent="雲端資料已載入";if($("displaySync"))$("displaySync").textContent="☁️ 已連線雲端 · "+new Date().toLocaleTimeString();return true}else{$("syncstatus").textContent="雲端資料格式或內容尚未建立";if($("displaySync"))$("displaySync").textContent="⚠️ 雲端尚無有效計票資料";return false}}
async function startRealtime(){if(channel)await sb.removeChannel(channel);channel=sb.channel("tally-live").on("postgres_changes",{event:"UPDATE",schema:"public",table:"election_tally",filter:"id=eq.main"},payload=>{if(payload.new?.data&&Array.isArray(payload.new.data.candidates)&&Array.isArray(payload.new.data.boxes)){state=normalizeCandidates(payload.new.data);render();$("syncstatus").textContent="其他裝置已更新 · "+new Date().toLocaleTimeString();if($("displaySync"))$("displaySync").textContent="🔄 即時更新 · "+new Date().toLocaleTimeString()}}).subscribe(status=>{if($("displaySync")&&status!=="SUBSCRIBED")$("displaySync").textContent="即時連線狀態："+status})}
$("login").onclick=async()=>{const btn=$("login"),email=$("email").value.trim(),password=$("password").value;btn.disabled=true;btn.textContent="登入中…";$("loginmsg").textContent="正在連線 Supabase，請稍候…";try{if(!window.supabase||!window.supabase.createClient){throw new Error("Supabase JS 載入失敗，請重新整理或換瀏覽器試試。")}if(!email||!password){throw new Error("請輸入管理者 Email 與密碼。")}const {data,error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;session=data.session;$("loginmsg").textContent="登入成功";$("app").querySelector(".login").classList.add("hide");$("admin").classList.remove("hide");await load();await startRealtime()}catch(err){$("loginmsg").textContent="登入失敗："+(err?.message||String(err));}finally{btn.disabled=false;btn.textContent="登入"}}
$("logout").onclick=async()=>{await sb.auth.signOut();session=null;$("admin").classList.add("hide");$("app").querySelector(".login").classList.remove("hide")}
$("saveCandidates").onclick=async()=>{document.querySelectorAll("#candidateEdit [data-cid]").forEach(input=>{const c=state.candidates.find(c=>c.id===input.dataset.cid);if(c)c.name=input.value.trim()});render();await save()}
$("addCandidate").onclick=()=>{const max=Math.max(0,...state.candidates.map(c=>Number(c.id)||0));state.candidates.push({id:String(max+1),name:"新候選人"});render()}
$("addBox").onclick=async()=>{const n=$("newBoxName").value.trim();if(!n)return;state.boxes.push({name:n,votes:Object.fromEntries(state.candidates.map(c=>[c.id,0]))});$("newBoxName").value="";render();await save()}
$("boxes").addEventListener("change",async e=>{if(e.target.classList.contains("vote")){const b=state.boxes[Number(e.target.dataset.box)],id=e.target.dataset.cid;const v=Math.max(0,Math.floor(Number(e.target.value)||0));b.votes[id]=v;render();await save()}})
$("quickBoxSelector").onclick=e=>{const btn=e.target.closest("[data-quickbox]");if(!btn)return;selectedQuickBox=btn.dataset.quickbox==="all"?null:Number(btn.dataset.quickbox);renderBoxes()};$("boxes").addEventListener("click",async e=>{const d=e.target.dataset.del,r=e.target.dataset.rename,z=e.target.dataset.clear;if(d!==undefined){if(confirm("確定刪除這個票箱及其票數？")){state.boxes.splice(Number(d),1);render();await save()}}if(r!==undefined){const b=state.boxes[Number(r)],n=prompt("請輸入票箱名稱",b.name);if(n?.trim()){b.name=n.trim();render();await save()}}if(z!==undefined){const b=state.boxes[Number(z)];if(confirm("確定將「"+b.name+"」所有候選人票數清零？此操作會同步到所有裝置。")){b.votes=Object.fromEntries(state.candidates.map(c=>[c.id,0]));render();await save()}}})
$("clearAllBoxes").onclick=async()=>{if(!state.boxes.length){alert("目前沒有票箱");return}if(confirm("⚠️ 確定要將所有票箱的所有候選人票數全部清零？此操作會同步到所有裝置，且無法自動復原！")){state.boxes.forEach(b=>b.votes=Object.fromEntries(state.candidates.map(c=>[c.id,0])));render();await save()}}
$("exportBtn").onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="竹山計票雲端備份.json";a.click();URL.revokeObjectURL(a.href)}
$("importFile").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const parsed=JSON.parse(await f.text());if(!Array.isArray(parsed.candidates)||!Array.isArray(parsed.boxes))throw Error("格式不正確");state=parsed;render();await save();alert("備份匯入並同步完成")}catch(err){alert("匯入失敗："+err.message)}e.target.value=""}
async function openDisplay(){$("app").classList.add("hide");$("displayView").classList.remove("hide");$("displayRanking").innerHTML='<div style="text-align:center;padding:24px">正在載入雲端票數…</div>';if(pollTimer)clearInterval(pollTimer);try{await load();await startRealtime();pollTimer=setInterval(async()=>{const ok=await load();if(ok&&$("displaySync"))$("displaySync").textContent="☁️ 雲端輪詢同步 · "+new Date().toLocaleTimeString()},5000)}catch(err){$("displayRanking").innerHTML='<div style="text-align:center;padding:24px">雲端載入失敗：'+esc(err.message||String(err))+'</div>'}renderDisplay();if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{})}
function closeDisplay(){$("displayView").classList.add("hide");$("app").classList.remove("hide");if(document.fullscreenElement)document.exitFullscreen().catch(()=>{})}
$("displayBtn").onclick=openDisplay;$("displayOpen").onclick=openDisplay;$("displayBoxSelector").onclick=e=>{const btn=e.target.closest("[data-displaybox]");if(!btn)return;selectedDisplayBox=Number(btn.dataset.displaybox);renderDisplay()};$("displayExit").onclick=closeDisplay;
</script></body></html>
